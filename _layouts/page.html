---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="hero-label">{{ page.label | default: page.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</article>
